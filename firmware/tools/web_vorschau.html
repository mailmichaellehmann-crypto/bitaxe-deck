<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Satoshi Deck</title><style>:root{--fg:#ececec;--mut:#9a9a9a;--dim:#5e5e5e;--line:#262626;--pink:#ffd4d4;--sans:ui-sans-serif,-apple-system,'Helvetica Neue',Inter,Arial,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}#mos{display:grid;grid-template-columns:repeat(48,1fr);gap:2px;padding:2px;height:64px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%)}#mos i{display:block;border-radius:1px}main{max-width:440px;margin:0 auto;padding:28px 20px 48px}h1{font-weight:500;font-size:44px;letter-spacing:-1.2px;line-height:1;margin:8px 0 14px}p{color:var(--mut);font-size:15px;line-height:1.5;margin:0 0 8px}.sec{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin:30px 0 4px;padding-bottom:10px;border-bottom:1px solid var(--line)}label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin:16px 0 7px}input,select{width:100%;padding:12px 14px;border-radius:10px;font:16px var(--sans);color:var(--fg);background:#000;border:1px solid var(--line);-webkit-appearance:none;appearance:none}input:focus,select:focus{outline:none;border-color:var(--fg)}input::placeholder{color:var(--dim)}.row{display:flex;gap:10px}button{margin-top:32px;padding:13px 26px;border:0;border-radius:999px;font:500 14px var(--mono);color:#000;background:var(--fg);cursor:pointer}button:active{background:var(--pink)}.acc{color:var(--pink)}small{color:var(--dim);font-family:var(--mono);font-size:12px}</style></head><body><div id=mos></div><main><script>(function(){var m=document.getElementById('mos');for(var i=0;i<48*6;i++){var x=i%48,r=Math.random(),g=Math.round(14+r*r*58*(x/48+.3));var e=document.createElement('i');e.style.background=(i==48*6-1)?'#ffd4d4':'rgb('+g+','+g+','+g+')';m.appendChild(e)}})()</script><h1>Satoshi Deck</h1><p>Einstellungen für dein Display. <span class=acc>Speichern startet es neu.</span></p><form method=post action=/save><div class=sec>Verbindung</div><label>WLAN-Name</label><input name=ssid list=nets value='MeinWLAN' required maxlength=32 autocomplete=off><datalist id=nets><option value="MeinWLAN"></datalist><label>WLAN-Passwort</label><input name=pass type=password maxlength=64 placeholder='unverändert lassen'><label>Bitaxe – IP-Adresse</label><input name=bitaxe value='192.168.1.42' placeholder='192.168.1.42' maxlength=63><div class=sec>Preisalarm</div><div class=row><div style='flex:1'><label>Oberhalb (USD)</label><input name=al_hi value='100000' inputmode=numeric></div><div style='flex:1'><label>Unterhalb (USD)</label><input name=al_lo value='0' inputmode=numeric></div></div><div class=sec>Anzeige</div><div class=row><div style='flex:1'><label>Nachtmodus ab</label><input name=n_from value='22' inputmode=numeric></div><div style='flex:1'><label>bis (Uhr)</label><input name=n_to value='7' inputmode=numeric></div></div><label>Chart-Fläche</label><select name=cstyle><option value=0 selected>Punkte</option><option value=1 >Ohne Verlauf</option></select><button>Speichern &rarr;</button></form><p style='margin-top:28px'><small>0 = Alarm aus · IP des Bitaxe steht im AxeOS-Webinterface · v.1.3.0</small></p></main></body></html>
