# Baut die Firmware bei jedem Push und veröffentlicht sie bei einem Tag „v*“ als Release.
# Das Display holt sich von dort automatisch Updates (Datei bitaxe_deck.bin).
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > firmware/version.txt

      - name: Update-Quelle auf dieses Repository setzen
        run: echo "CONFIG_DECK_OTA_REPO=\"${{ github.repository }}\"" >> firmware/sdkconfig.defaults

      - name: Bauen (ESP-IDF v5.3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: firmware

      - name: Komplett-Image für die Erstinstallation erzeugen
        run: |
          pip install --quiet esptool
          mkdir -p dist
          cp firmware/build/bitaxe_deck.bin dist/
          cd firmware/build
          python -m esptool --chip esp32s3 merge_bin -o ../../dist/bitaxe_deck_full.bin @flash_args
          ls -la ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
